<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Coffee House</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Styles -->

    <link rel="stylesheet" href="style.css">


    <!-- Telegram SDK -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">


        <div>

            <p class="subtitle">
                Добро пожаловать
            </p>


            <h1>
                Coffee House
            </h1>

        </div>



        <button
            class="cart-button"
            id="cartOpen"
        >

            🛒


            <span id="cartCount">
                0
            </span>


        </button>


    </header>



    <!-- SEARCH -->


    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Поиск напитков и десертов..."
        >

    </div>




    <!-- CATEGORY -->


    <div
        class="categories"
        id="categories"
    >

    </div>




    <!-- PRODUCTS -->


    <main
        class="products-grid"
        id="products"
    >

    </main>


</div>





<!-- FLOATING CART -->


<div
    class="floating-cart hidden"
    id="floatingCart"
>


    <div>


        <span>
            Корзина
        </span>


        <strong id="floatingTotal">
            0 ₽
        </strong>


    </div>



    <button id="openCartBottom">

        Открыть

    </button>


</div>






<!-- PRODUCT MODAL -->


<div
    class="modal"
    id="productModal"
>


    <div class="modal-window">


        <button
            class="modal-close"
            id="closeModal"
        >
            ×
        </button>



        <img
            id="modalImage"
            src=""
            alt=""
        >


        <h2 id="modalTitle">
        </h2>


        <p id="modalComposition">
        </p>


    </div>


</div>






<!-- CART SHEET -->


<div
    class="cart-sheet"
    id="cartSheet"
>


    <div class="cart-top">


        <h2>
            Корзина
        </h2>


        <button id="closeCart">
            ×
        </button>


    </div>




    <div
        id="cartItems"
        class="cart-items"
    >

    </div>





    <div class="cart-bottom">


        <div>

            <span>
                Итого
            </span>


            <strong id="cartTotal">
                0 ₽
            </strong>


        </div>



        <button
            class="checkout"
            id="checkout"
        >

            Оформить заказ

        </button>


    </div>



</div>





<div
    class="overlay"
    id="overlay"
>

</div>







<!-- BOTTOM MENU -->


<nav class="bottom-nav">


<button
    class="nav-button active"
    data-page="menu"
>

☕

<span>
Меню
</span>

</button>




<button
    class="nav-button"
    data-page="favorites"
>

❤️

<span>
Избранное
</span>

</button>





<button
    class="nav-button"
    data-page="cart"
>

🛒

<span>
Корзина
</span>

</button>



</nav>





<script
    type="module"
    src="js/app.js"
></script>


</body>

</html>
